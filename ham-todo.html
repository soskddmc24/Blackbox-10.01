<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>보노보노 무지개 투두</title><style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;color:#24194a;font:16px/1.5 Arial,'Malgun Gothic',sans-serif;background:linear-gradient(115deg,#ff9a75,#ffe875,#baff9d,#6bdbec,#8996ff,#d978e9);background-attachment:fixed;overflow-x:hidden}body:before,body:after{content:'🌈 ✦ 🌈 ✦ 🌈 ✦ 🌈 ✦ 🌈';position:fixed;z-index:-1;font-size:48px;opacity:.38;white-space:nowrap;transform:rotate(-9deg);bottom:3%;right:-12%}body:after{top:5%;bottom:auto;right:-8%;transform:rotate(8deg);font-size:39px}.top{padding:20px 6vw 8px;display:flex;justify-content:space-between;color:#fff;text-shadow:2px 2px #e34479,-2px -2px #2d62be,4px 4px #7341a6}.brand{font-weight:900;font-size:25px;letter-spacing:2px;transform:rotate(-4deg)}.date{font-weight:bold;background:#ffffff70;padding:7px 13px;border-radius:99px}main{max-width:1220px;margin:auto;padding:12px 24px 50px}.hero{position:relative;min-height:245px;padding:34px 340px 24px 34px;overflow:hidden;border:6px solid #fff;border-radius:28px;background:linear-gradient(100deg,#ff9b71,#fff568,#b7ff9f,#74daf7,#ae75f0);box-shadow:0 20px 45px #5b1d6544}.hero:before{content:'보노보노  보노보노  보노보노';position:absolute;top:10px;left:-10px;color:#fff8;font-size:30px;font-weight:900;letter-spacing:7px;white-space:nowrap;transform:rotate(-5deg)}h1{position:relative;margin:35px 0 4px;font-size:34px;line-height:1.1;color:white;text-shadow:3px 3px #ee4a85,-2px -2px #3159bd,6px 5px #8b4cbd;transform:rotate(-2deg)}.hero p{position:relative;margin:10px 0;padding:7px 11px;display:inline-block;background:#fff9;border-radius:8px;font-weight:bold}.speech{display:block;position:relative;width:max-content;max-width:220px;padding:8px 13px;background:#ffe582;border:2px solid #24194a;border-radius:18px 18px 18px 2px;font-weight:bold;font-size:14px;transform:rotate(-3deg)}.bono{position:absolute;right:15px;bottom:-36px;width:310px;filter:drop-shadow(6px 9px 0 #fff9) drop-shadow(0 12px 12px #25206066);transform:rotate(3deg)}.summary{display:grid;grid-template-columns:repeat(3,1fr);gap:15px;margin:20px 0}.stat{padding:17px;border:3px solid white;border-radius:18px;background:#ffffffc9;box-shadow:5px 6px #4d3a9a55;transform:rotate(-1deg)}.stat:nth-child(2){background:#fff19d;transform:rotate(1deg)}.stat:nth-child(3){background:#a8f5e1}.stat b{display:block;font-size:30px;color:#523fab}.stat span{font-size:13px;font-weight:bold}.bar{display:flex;justify-content:space-between;align-items:center;margin:23px 0 15px}.bar h2{margin:0;color:#fff;text-shadow:2px 2px #7e3ca2,-2px -2px #2852bb;transform:rotate(-2deg)}button{border:2px solid #2b2052;border-radius:11px;padding:9px 13px;background:#fff;color:#24194a;font-weight:800;box-shadow:3px 4px #423072;cursor:pointer}button:hover{transform:translate(2px,2px);box-shadow:1px 2px #423072}.add{background:#ffdf71;transform:rotate(2deg)}.boards{display:grid;grid-template-columns:1fr 1fr;gap:21px}.board{min-height:300px;padding:17px;border:5px solid #fff;border-radius:23px;background:#ffffffc9;box-shadow:8px 9px #49368055}.board:nth-child(1){transform:rotate(-.7deg)}.board:nth-child(2){transform:rotate(.8deg);background:#e1d6ffcf}.board-head{display:flex;justify-content:space-between;margin-bottom:13px;padding-bottom:9px;border-bottom:3px dashed #8168c1}.board h3{margin:0;font-size:21px}.count{background:#6e51bd;color:white;border-radius:99px;padding:3px 9px;font-size:13px}.card{position:relative;margin:11px 0;padding:14px 42px 13px 15px;border:2px solid #443470;border-radius:14px;background:#fffdf7;box-shadow:4px 5px #5e4ba133}.card:nth-child(even){transform:rotate(-.5deg)}.card.done{background:#e8edff;opacity:.77}.title{font-weight:900;overflow-wrap:anywhere}.done .title{text-decoration:line-through}.meta{display:flex;gap:5px;flex-wrap:wrap;margin-top:8px;font-size:12px;font-weight:bold}.tag{padding:3px 7px;background:#ffd7f1;border-radius:99px}.start{background:#c9f8dc}.due{background:#fff1ac}.finish{position:absolute;right:9px;top:10px;padding:6px 7px;background:#8ae4d1;font-size:12px}.edit{position:absolute;right:10px;bottom:8px;border:0;box-shadow:none;background:transparent;padding:2px;color:#6958a0}.move button{padding:1px 5px;border:0;box-shadow:none;background:#d9cffc}.move,.finished{font-size:12px;color:#726890;margin-top:8px}.empty{padding:42px 10px;text-align:center;color:#625889;font-weight:bold}dialog{width:min(480px,calc(100% - 28px));border:5px solid white;border-radius:23px;background:linear-gradient(125deg,#ffda9e,#ffb4c9,#b8e7ff);box-shadow:9px 10px #49338166;color:#241b47}dialog::backdrop{background:#38266380;backdrop-filter:blur(5px)}dialog h2{margin:0 0 17px;text-shadow:1px 1px white}.field{display:block;margin:11px 0;font-weight:bold}.field input{display:block;width:100%;margin-top:5px;padding:10px;border:2px solid #39295d;border-radius:9px;background:#fffd}.dates{display:grid;grid-template-columns:1fr 1fr;gap:9px}.dialog-actions{display:flex;justify-content:flex-end;gap:10px;margin-top:20px}.yes{background:#a2f2cc}.confirm-task{padding:13px;background:#fffd;border-radius:12px;font-weight:bold}footer{text-align:center;margin-top:29px;color:white;font-size:12px;font-weight:bold;text-shadow:1px 1px #553a9b}@media(max-width:720px){main{padding:8px 13px 40px}.top{padding:17px 18px 7px}.brand{font-size:20px}.date{font-size:12px}.hero{min-height:260px;padding:24px 174px 12px 22px}h1{font-size:26px}.hero p{font-size:13px}.bono{width:190px;right:-26px;bottom:-6px}.summary{gap:8px}.stat{padding:12px 8px}.stat b{font-size:25px}.stat span{font-size:11px}.boards{grid-template-columns:1fr;gap:16px}.board:nth-child(2){transform:rotate(-.3deg)}.dates{grid-template-columns:1fr}}
 .delete{position:absolute;right:10px;bottom:8px;padding:4px 7px;border:0;box-shadow:none;background:#ffb2c9;font-size:12px}</style></head><body><header class="top"><div class="brand">🌈 보노보노 투두 🌈</div><div id="today" class="date"></div></header><main><section class="hero"><h1>마지 보노보노삐와<br>무지개 투두삐~</h1><p>할 일 끝내면 보노보노 마지 우레시~</p><span class="speech">“이거 끝내도 이이~?”</span><img class="bono" src="bonobono-checklist.png" alt="체크리스트를 든 보노보노"></section><section class="summary"><div class="stat"><span>할 일</span><b id="todoTotal">0</b></div><div class="stat"><span>완료한 일</span><b id="doneTotal">0</b></div><div class="stat"><span>전체 진행률</span><b id="percent">0%</b></div></section><div class="bar"><h2>마지 무지개 체크리스트삐~ ✦</h2><button class="add" id="add">＋ 할 일 추가삐~</button></div><section class="boards"><div class="board"><div class="board-head"><h3>🌤 할 일 삐~</h3><span id="todoCount" class="count">0</span></div><div id="todos"></div></div><div class="board"><div class="board-head"><h3>🎉 끝낸 일 마지 우레시~</h3><span id="doneCount" class="count">0</span></div><div id="done"></div></div></section><footer>보노보노 무지개 투두 · 목록은 이 브라우저에 저장돼요.</footer></main><dialog id="editor"><form id="form"><h2 id="editorTitle">🌈 할 일 추가</h2><label class="field">할 일<input id="title" maxlength="120" required></label><label class="field">담당자<input id="owner" maxlength="30"></label><div class="dates"><label class="field">시작 날짜<input id="start" type="date"></label><label class="field">마감 날짜<input id="due" type="date"></label></div><div class="dialog-actions"><button type="button" id="cancel">취소</button><button class="yes">저장하기</button></div></form></dialog><dialog id="confirm"><h2>🌈 이 할 일 끝낼 거얌?</h2><p id="confirmTitle" class="confirm-task"></p><div class="dialog-actions"><button id="no">아니얌~</button><button class="yes" id="yes">예! 마지 끝냈삐~!</button></div></dialog><script>
const $=x=>document.getElementById(x),KEY='ham-todo-v3',now=new Date().toISOString().slice(0,10);let tasks=[],edit=null,finish=null;const e=s=>String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const fmt=d=>d?new Intl.DateTimeFormat('ko-KR',{month:'long',day:'numeric'}).format(new Date(d+'T00:00:00')):'날짜 미정';try{let raw=localStorage.getItem(KEY)||localStorage.getItem('ham-todo-v2')||localStorage.getItem('ham-todo-v1');tasks=raw?JSON.parse(raw).map(t=>({...t,done:!!t.done,start:t.start||t.startDate||'',due:t.due||t.dueDate||'',completed:t.completed||t.completedAt||''})):[]}catch{}function save(){localStorage.setItem(KEY,JSON.stringify(tasks));render()}function card(t,i){let meta=`<div class="meta"><span class="tag">${e(t.owner||'담당자 미정')}</span><span class="tag start">시작 ${fmt(t.start)}</span><span class="tag due">마감 ${fmt(t.due)}</span></div>`;return t.done?`<article class="card done"><div class="title">${e(t.title)}</div>${meta}<div class="finished">✓ ${fmt(t.completed)}에 마지 끝냈삐~</div><button class="delete" data-delete="${t.id}">지우기삐</button></article>`:`<article class="card"><div class="move">순서 ${i+1} <button data-move="up" data-id="${t.id}" ${i?'':'disabled'}>↑</button><button data-move="down" data-id="${t.id}" ${i===tasks.filter(x=>!x.done).length-1?'disabled':''}>↓</button></div><div class="title">${e(t.title)}</div>${meta}<button class="finish" data-finish="${t.id}">끝내기</button><button class="edit" data-edit="${t.id}">✎ 수정</button></article>`}function render(){let todo=tasks.filter(t=>!t.done),done=tasks.filter(t=>t.done),p=tasks.length?Math.round(done.length/tasks.length*100):0;$('todoTotal').textContent=todo.length;$('doneTotal').textContent=done.length;$('percent').textContent=p+'%';$('todoCount').textContent=todo.length;$('doneCount').textContent=done.length;$('todos').innerHTML=todo.length?todo.map(card).join(''):'<div class="empty">보노보노도 기다리고 있어요.<br>첫 할 일을 적어보세요!</div>';$('done').innerHTML=done.length?done.map(card).join(''):'<div class="empty">아직 완료한 일이 없어요.<br>작은 일부터 끝내봐요.</div>'}function open(id){edit=id;let t=tasks.find(x=>x.id===id)||{};$('editorTitle').textContent=id?'✦ 할 일 수정':'🌈 할 일 추가';$('title').value=t.title||'';$('owner').value=t.owner||'';$('start').value=t.start||'';$('due').value=t.due||'';$('editor').showModal();$('title').focus()}$('add').onclick=()=>open();$('cancel').onclick=()=>$('editor').close();$('form').onsubmit=x=>{x.preventDefault();let data={title:$('title').value.trim(),owner:$('owner').value.trim(),start:$('start').value,due:$('due').value};if(data.start&&data.due&&data.due<data.start)return alert('마감 날짜는 시작 날짜보다 빠를 수 없어요.');let t=tasks.find(x=>x.id===edit);if(t)Object.assign(t,data);else tasks.push({id:crypto.randomUUID(),...data,done:false,completed:''});save();$('editor').close()};document.addEventListener('click',x=>{let id=x.target.dataset.finish||x.target.dataset.edit||x.target.dataset.delete||x.target.dataset.id;if(!id)return;if(x.target.dataset.delete){tasks=tasks.filter(t=>t.id!==id);save()}else if(x.target.dataset.finish){finish=id;$('confirmTitle').textContent=tasks.find(t=>t.id===id).title;$('confirm').showModal()}else if(x.target.dataset.edit)open(id);else if(x.target.dataset.move){let a=tasks.findIndex(t=>t.id===id),b=x.target.dataset.move==='up'?a-1:a+1;if(tasks[b]&&!tasks[b].done){[tasks[a],tasks[b]]=[tasks[b],tasks[a]];save()}}});$('no').onclick=()=>$('confirm').close();$('yes').onclick=()=>{let t=tasks.find(x=>x.id===finish);if(t){t.done=true;t.completed=now;save()}$('confirm').close()};$('today').textContent=new Intl.DateTimeFormat('ko-KR',{month:'long',day:'numeric',weekday:'short'}).format(new Date());render();
</script></body></html>
